name: sapa_stroke
description: "Aplikasi komunikasi sederhana untuk pasien stroke."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_tts: 4.0.0
  audioplayers: 6.0.0
  shared_preferences: 2.2.3
  vibration: ^3.1.3
  wakelock_plus: 1.2.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/

dependency_overrides:
  shared_preferences_android: 2.2.2
